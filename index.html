<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ندي | NADA - The Discovery</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Syne:wght@700;800&family=Tajawal:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #020005;
            --purple: #9d4edd;
            --purple-glow: #e0aaff;
            --pink: #ff69b4;
            --pink-glow: #ffb6c1;
            --cyan: #00f0ff;
            --red: #ff4d6d;
            --green: #00ff88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100dvh; overflow: hidden;
            background-color: var(--bg); font-family: 'Cairo', sans-serif;
            touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* ================= UI System Overlay ================= */
        .system-ui {
            position: absolute; inset: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
            pointer-events: none; z-index: 5; display: flex; flex-direction: column; justify-content: space-between;
        }
        .sys-header, .sys-footer {
            display: flex; justify-content: space-between; font-family: monospace;
            font-size: 0.65rem; color: rgba(224, 170, 255, 0.4); letter-spacing: 1px;
        }
        .sys-status { display: flex; align-items: center; gap: 5px; }
        .sys-dot { width: 6px; height: 6px; background: var(--pink); border-radius: 50%; box-shadow: 0 0 10px var(--pink); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ================= الخلفية 3D ================= */
        #canvas-container { position: fixed; inset: 0; z-index: 0; }

        /* ================= شاشة المقدمة (Intro) ================= */
        #intro-wrapper {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding-bottom: 15vh;
        }

        .scene-3d { perspective: 1000px; display: flex; justify-content: center; align-items: center; transform-style: preserve-3d; margin-bottom: 30px; }
        .text-3d { position: relative; font-family: 'Tajawal', sans-serif; font-size: clamp(5rem, 22vw, 9rem); font-weight: 900; color: var(--purple-glow); transform-style: preserve-3d; animation: float3D 5s ease-in-out infinite; }
        .text-3d span { position: absolute; top: 0; left: 0; width: 100%; height: 100%; text-align: center; display: flex; justify-content: center; align-items: center; }
        .text-3d span:nth-child(1) { transform: translateZ(0px); color: var(--purple-glow); text-shadow: 0 0 30px var(--purple); }
        .text-3d span:nth-child(2) { transform: translateZ(-8px); color: #b06cf2; }
        .text-3d span:nth-child(3) { transform: translateZ(-16px); color: #8040c0; }
        .text-3d span:nth-child(4) { transform: translateZ(-24px); color: #502080; }
        .text-3d span:nth-child(5) { transform: translateZ(-32px); color: #200040; }
        .text-3d .front { position: relative; transform: translateZ(15px); background: linear-gradient(135deg, #fff, var(--purple-glow), var(--purple), #fff); background-size: 300% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 4s linear infinite; }
        @keyframes float3D { 0%, 100% { transform: rotateX(8deg) rotateY(-8deg) translateY(0); } 50% { transform: rotateX(12deg) rotateY(8deg) translateY(-10px); } }
        @keyframes shine { to { background-position: 300% center; } }

        .nada-badge-container { position: relative; margin-top: 10px; display: flex; justify-content: center; align-items: center; }
        .crown { position: absolute; top: -40px; font-size: 2.5rem; z-index: 15; filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)); animation: crownFloat 3s ease-in-out infinite; }
        @keyframes crownFloat { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-8px) rotate(5deg); } }
        .nada-box { background: rgba(15, 5, 30, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(157, 78, 221, 0.5); border-radius: 16px; padding: 20px 40px; box-shadow: 0 0 30px rgba(157, 78, 221, 0.3), inset 0 0 20px rgba(157, 78, 221, 0.15); display: flex; justify-content: center; align-items: center; min-width: 220px; }
        .english-text { font-family: 'Syne', sans-serif; font-size: clamp(1.5rem, 7vw, 2.2rem); font-weight: 800; letter-spacing: clamp(6px, 4vw, 12px); direction: ltr; background: linear-gradient(135deg, #fff, var(--purple-glow), var(--purple), #fff); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 20px rgba(157, 78, 221, 0.6); animation: shine 3s linear infinite; }
        .cursor { color: var(--purple-glow); animation: blink 1s step-end infinite; margin-left: 5px; font-weight: 300; }
        @keyframes blink { 50% { opacity: 0; } }

        /* ================= AI Chat ================= */
        .ai-container { position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); right: 50%; transform: translate(50%, 30px); opacity: 0; z-index: 20; width: 90%; max-width: 400px; }
        .ai-box { background: rgba(10, 3, 20, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(157, 78, 221, 0.4); border-radius: 20px; border-bottom-right-radius: 4px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(157, 78, 221, 0.15); }
        .ai-avatar { width: 45px; height: 45px; background: linear-gradient(135deg, rgba(157, 78, 221, 0.2), rgba(0, 240, 255, 0.1)); border: 1px solid rgba(157, 78, 221, 0.6); border-radius: 12px; display: flex; justify-content: center; align-items: center; position: relative; flex-shrink: 0; }
        .ai-avatar svg { width: 26px; height: 26px; fill: var(--purple-glow); }
        .ai-avatar::after { content: ''; position: absolute; bottom: -2px; right: -2px; width: 10px; height: 10px; background: var(--cyan); border-radius: 50%; border: 2px solid #0a0314; box-shadow: 0 0 10px var(--cyan); }
        .ai-content { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .ai-name { font-size: 0.7rem; color: var(--purple-glow); font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .ai-name span { font-size: 0.6rem; color: rgba(255,255,255,0.4); }
        .ai-text { font-size: 0.95rem; color: #e8e0ff; line-height: 1.4; font-weight: 600; min-height: 20px; }
        .typing-dots { display: flex; gap: 4px; align-items: center; height: 20px; }
        .typing-dots span { width: 5px; height: 5px; background: var(--purple-glow); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; box-shadow: 0 0 10px var(--purple); } }

        /* ================= شاشة تسجيل الدخول (بناتي) ================= */
        #login-wrapper {
            position: absolute; inset: 0; z-index: 30; display: none; opacity: 0;
            flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(2, 0, 5, 0.4) 0%, rgba(2, 0, 5, 0.85) 100%);
            backdrop-filter: blur(12px);
        }

        /* الحاجات البناتي في الخلفية */
        .girly-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
        .girly-item { 
            position: absolute; bottom: -10vh; 
            animation: floatGirly linear infinite; 
            filter: drop-shadow(0 0 10px rgba(255,105,180,0.4));
        }
        @keyframes floatGirly { 
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; } 
            10% { opacity: 0.8; } 
            90% { opacity: 0.8; } 
            100% { transform: translateY(-120vh) rotate(360deg) scale(1.2); opacity: 0; } 
        }

        .login-box {
            width: 90%; max-width: 380px;
            background: rgba(30, 10, 40, 0.6);
            border: 1px solid rgba(255, 105, 180, 0.4);
            border-radius: 30px;
            padding: 40px 30px;
            position: relative;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(255, 105, 180, 0.15);
            text-align: center;
        }

        .login-icon { font-size: 3rem; margin-bottom: 15px; display: inline-block; animation: pulseHeart 2s infinite; }
        @keyframes pulseHeart { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); filter: drop-shadow(0 0 15px var(--pink)); } }

        .login-title {
            font-family: 'Tajawal', sans-serif;
            color: var(--pink-glow);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }

        .login-subtitle { font-size: 0.85rem; color: rgba(255, 255, 255, 0.6); margin-bottom: 30px; }

        .input-group { position: relative; margin-bottom: 25px; }
        .input-group input {
            width: 100%; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 105, 180, 0.4);
            border-radius: 50px;
            padding: 16px 20px;
            color: var(--pink-glow); font-family: 'Cairo', sans-serif; font-size: 1rem;
            outline: none; transition: 0.4s;
            text-align: center; letter-spacing: 2px;
        }
        .input-group input::placeholder { color: rgba(255, 182, 193, 0.4); font-size: 0.9rem; letter-spacing: normal; }
        .input-group input:focus { border-color: var(--pink); box-shadow: 0 0 25px rgba(255, 105, 180, 0.3); background: rgba(30, 10, 40, 0.8); }

        .btn-login {
            width: 100%; padding: 16px; border: none; border-radius: 50px;
            background: linear-gradient(135deg, #ff69b4, #9d4edd);
            color: #fff; font-weight: 700; font-family: 'Cairo', sans-serif;
            font-size: 1.1rem; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.3);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-login:active { transform: scale(0.96); }
        .btn-login:disabled { background: #555; cursor: not-allowed; box-shadow: none; opacity: 0.7; }

        /* رسالة الخطأ أو النجاح */
        .msg-text {
            font-size: 1.1rem; font-weight: 700;
            margin-top: 20px; height: 25px; opacity: 0; transition: 0.3s;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .msg-text.show { opacity: 1; animation: popMsg 0.4s ease; }
        @keyframes popMsg { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }

        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } }
        
    </style>
</head>
<body>

    <!-- UI الخلفي -->
    <div class="system-ui">
        <div class="sys-header">
            <div class="sys-status"><div class="sys-dot"></div> SYSTEM ONLINE</div>
            <div>SECURED</div>
        </div>
        <div class="sys-footer">
            <div>DISCOVERY PROTOCOL v2.0</div>
        </div>
    </div>

    <!-- الخلفية السينمائية 3D -->
    <div id="canvas-container"></div>

    <!-- ================= 1. شاشة المقدمة ================= -->
    <div id="intro-wrapper">
        <div class="scene-3d" id="arabicText">
            <div class="text-3d">
                <span class="front">ندي</span>
                <span></span><span></span><span></span><span></span>
            </div>
        </div>

        <div class="nada-badge-container" id="nadaBadge">
            <div class="crown" id="crownIcon">👑</div>
            <div class="nada-box">
                <div class="english-text">
                    <span id="typewriter"></span><span class="cursor">|</span>
                </div>
            </div>
        </div>
    </div>

    <!-- AI Chat (بتاع المقدمة) -->
    <div class="ai-container" id="aiContainer">
        <div class="ai-box">
            <div class="ai-avatar">
                <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h3a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-7a4 4 0 0 1 4-4h3V5.73A2 2 0 0 1 12 2zM8 11a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-8 5v2h8v-2H8z"/></svg>
            </div>
            <div class="ai-content">
                <div class="ai-name">NADA-AI <span>| مساعدك الشخصي</span></div>
                <div class="ai-text" id="aiText"></div>
            </div>
        </div>
    </div>

    <!-- ================= 2. شاشة تسجيل الدخول ================= -->
    <div id="login-wrapper">
        <!-- الحاجات البناتي الطايرة -->
        <div class="girly-bg" id="girlyBg"></div>

        <div class="login-box" id="loginBox">
            <div class="login-icon">🎀</div>
            <h2 class="login-title">اكتبي الباسورد يقلب بابا</h2>
            <p class="login-subtitle">عشان تفتحي سرنا الصغير 💗</p>

            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="الباسورد السري هنا.." autocomplete="off">
            </div>

            <button class="btn-login" id="loginBtn" onclick="verifyPassword()">
                الدخول الي مملكتك يندي 💖
            </button>

            <p class="msg-text" id="msgText"></p>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. إعداد الخلفية الـ 3D (النجوم)
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        const color1 = new THREE.Color(0x9d4edd);
        const color2 = new THREE.Color(0x00f0ff); 

        for(let i = 0; i < particlesCount * 3; i++) {
            const radius = 3 + Math.random() * 5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);

            posArray[i] = Math.sin(phi) * Math.cos(theta) * radius;
            posArray[i+1] = Math.sin(phi) * Math.sin(theta) * radius;
            posArray[i+2] = Math.cos(phi) * radius;

            const mixedColor = color1.clone().lerp(color2, Math.random());
            colorsArray[i] = mixedColor.r;
            colorsArray[i+1] = mixedColor.g;
            colorsArray[i+2] = mixedColor.b;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.015, vertexColors: true, transparent: true,
            opacity: 0.8, blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 5;

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX / window.innerWidth - 0.5;
            mouseY = e.clientY / window.innerHeight - 0.5;
        });
        document.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                mouseX = e.touches[0].clientX / window.innerWidth - 0.5;
                mouseY = e.touches[0].clientY / window.innerHeight - 0.5;
            }
        }, { passive: true });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            particlesMesh.rotation.y = elapsedTime * 0.05;
            particlesMesh.rotation.x = elapsedTime * 0.02;
            particlesMesh.rotation.y += (mouseX * 0.5 - particlesMesh.rotation.y) * 0.05;
            particlesMesh.rotation.x += (mouseY * 0.5 - particlesMesh.rotation.x) * 0.05;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 2. تسلسل أنيميشن المقدمة
        // ==========================================
        gsap.set("#arabicText", { opacity: 0, scale: 0.5, rotationY: 90 });
        gsap.set("#nadaBadge", { opacity: 0, y: 30, scale: 0.8 });
        gsap.set("#crownIcon", { opacity: 0, y: -50, scale: 0 });

        const tl = gsap.timeline();

        tl.to("#arabicText", { duration: 1.5, opacity: 1, scale: 1, rotationY: 0, ease: "elastic.out(1, 0.7)", delay: 0.5 })
        .to("#nadaBadge", { duration: 0.8, opacity: 1, y: 0, scale: 1, ease: "back.out(1.5)" })
        .to("#crownIcon", { duration: 1, opacity: 1, y: 0, scale: 1, ease: "bounce.out", onComplete: startTypingNADA });

        const textNADA = "NADA";
        const typewriterEl = document.getElementById("typewriter");
        let i = 0;
        function startTypingNADA() {
            if (i < textNADA.length) {
                typewriterEl.innerHTML += textNADA.charAt(i);
                i++;
                setTimeout(startTypingNADA, Math.random() * 100 + 80);
            } else {
                setTimeout(triggerAI, 1000); 
            }
        }

        const aiContainer = document.getElementById("aiContainer");
        const aiTextEl = document.getElementById("aiText");
        function triggerAI() {
            gsap.to(aiContainer, {
                duration: 1, opacity: 1, y: 0, ease: "back.out(1.5)",
                onStart: () => {
                    aiTextEl.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
                    setTimeout(typeAIMessage, 1500);
                }
            });
        }

        const aiMessage = "استعدي يا ندي.. في سر مستنيكي ورا البوابة ✨";
        let j = 0;
        function typeAIMessage() {
            aiTextEl.innerHTML = ""; 
            function typeChar() {
                if (j < aiMessage.length) {
                    aiTextEl.innerHTML += aiMessage.charAt(j);
                    j++;
                    setTimeout(typeChar, 40);
                } else {
                    setTimeout(goToLogin, 3000);
                }
            }
            typeChar();
        }

        // ==========================================
        // 3. الانتقال لصفحة تسجيل الدخول
        // ==========================================
        function goToLogin() {
            const tlOut = gsap.timeline();
            
            tlOut.to(".ai-container", { opacity: 0, y: 20, duration: 0.5 })
                 .to("#intro-wrapper", { opacity: 0, scale: 0.9, duration: 0.8 }, "-=0.3")
                 .to(".system-ui", { opacity: 0.2, duration: 0.8 }, "-=0.8")
                 .set("#intro-wrapper", { display: "none" })
                 .set("#login-wrapper", { display: "flex" })
                 .to("#login-wrapper", { opacity: 1, duration: 1, onComplete: () => {
                     gsap.from("#loginBox", { y: 50, opacity: 0, duration: 1, ease: "back.out(1.5)" });
                 }});
        }

        // ==========================================
        // 4. الحاجات البناتي في الخلفية
        // ==========================================
        const girlyBg = document.getElementById('girlyBg');
        const girlyEmojis = ['🎀', '🌸', '💖', '🦋', '🧸', '✨', '💕', '🌷'];
        
        setInterval(() => {
            if(document.getElementById('login-wrapper').style.display === 'flex') {
                const item = document.createElement('div');
                item.className = 'girly-item';
                item.innerHTML = girlyEmojis[Math.floor(Math.random() * girlyEmojis.length)];
                item.style.left = Math.random() * 100 + 'vw';
                item.style.fontSize = (Math.random() * 20 + 15) + 'px'; // مقاسات مختلفة
                item.style.animationDuration = (Math.random() * 4 + 5) + 's'; // بين 5 و 9 ثواني
                girlyBg.appendChild(item);
                
                setTimeout(() => { item.remove(); }, 9000);
            }
        }, 300); // بيطلع عنصر كل 0.3 ثانية

        // ==========================================
        // 5. التحقق من الباسورد
        // ==========================================
        const ENCODED_PASS = "bmFkYW1yYXR5b3Vzc2VmMjAwOA=="; 
        
        const loginBox = document.getElementById("loginBox");
        const passInput = document.getElementById("passwordInput");
        const loginBtn = document.getElementById("loginBtn");
        const msgText = document.getElementById("msgText");
        
        let failCount = 0;
        let isLocked = false;

        passInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter" && !isLocked) {
                event.preventDefault();
                verifyPassword();
            }
        });

        function verifyPassword() {
            if (isLocked) return;

            const inputVal = passInput.value;
            if (inputVal === "") {
                showMsg("اكتبي الباسورد الأول يا قلبي 🥺", "var(--red)");
                return;
            }

            if (btoa(inputVal) === ENCODED_PASS) {
                // --- الباسورد صح ---
                loginBtn.innerHTML = "جاري الدخول...";
                loginBtn.style.background = "var(--green)";
                loginBtn.style.color = "#000";
                loginBtn.disabled = true;
                
                // إظهار رسالة النجاح بالأخضر
                showMsg("صح يقلب بابا 💖", "var(--green)");
                
                setTimeout(() => {
                    // هنا الانتقال للصفحة الجديدة
                    alert("أهلاً بيكي في مملكتك يا ندي! 👑✨");
                }, 1500);

            } else {
                // --- الباسورد غلط ---
                failCount++;
                loginBox.classList.add("shake");
                passInput.value = "";
                
                setTimeout(() => { loginBox.classList.remove("shake"); }, 500);

                if (failCount >= 3) {
                    startLockout();
                } else {
                    // إظهار رسالة الخطأ بالأحمر
                    showMsg("غلط يمرات يوسف 🥺", "var(--red)");
                }
            }
        }

        function showMsg(text, color) {
            msgText.innerHTML = text;
            msgText.style.color = color;
            msgText.classList.add("show");
            
            // إخفاء الرسالة بعد 3 ثواني (لو مش في حالة حظر)
            if (!isLocked) {
                setTimeout(() => { msgText.classList.remove("show"); }, 3000);
            }
        }

        function startLockout() {
            isLocked = true;
            loginBtn.disabled = true;
            passInput.disabled = true;
            loginBtn.style.background = "#555";
            loginBtn.innerHTML = `استني 30 ثانية يا قمر 🥺`;
            
            showMsg("محاولات كتير غلط، استني شوية!", "var(--red)");

            let timeLeft = 30;
            const timer = setInterval(() => {
                timeLeft--;
                loginBtn.innerHTML = `استني ${timeLeft} ثانية يا قمر 🥺`;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    isLocked = false;
                    failCount = 0;
                    loginBtn.disabled = false;
                    passInput.disabled = false;
                    loginBtn.innerHTML = "الدخول الي مملكتك يندي 💖";
                    loginBtn.style.background = "linear-gradient(135deg, #ff69b4, #9d4edd)";
                    msgText.classList.remove("show");
                    passInput.focus();
                }
            }, 1000);
        }

    </script>
</body>
</html>
